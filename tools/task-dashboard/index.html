<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>TACTICA FC · Görev Panosu</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0c0f;--panel:#15171b;--panel2:#1c1f24;--line:#34383e;--red:#e3293b;--red2:#ff5260;--silver:#eef0f3;--muted:#a4a9b2;--green:#58d39b;--amber:#ffc767}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 18% 0%,#291014 0,transparent 42%),var(--bg);color:var(--silver);font:15px/1.5 system-ui,Segoe UI,sans-serif}
    main{max-width:1120px;margin:0 auto;padding:28px 22px 48px}.top{display:flex;align-items:center;gap:16px;border-bottom:1px solid #57212a;padding:0 0 20px;margin-bottom:22px}.badge{width:52px;height:52px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#3c1118,#15171b 60%);border:1px solid #87303c;color:#fff;font-weight:900;box-shadow:0 0 24px #be1e3340}.badge span{color:var(--red2)}h1{font-size:24px;margin:0;letter-spacing:.04em}h1 small{color:var(--red2);font-size:13px;display:block;letter-spacing:.16em}.topmeta{margin-left:auto;text-align:right;color:var(--muted);font-size:12px}.topmeta strong{display:block;color:var(--silver);font-size:13px}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.card,.tracker{background:linear-gradient(155deg,#1b1e23,#121418);border:1px solid var(--line);border-radius:12px}.stat{padding:14px 16px}.stat b{font-size:25px;display:block}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.card{padding:18px;margin:14px 0}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cardhead h2{font-size:14px;letter-spacing:.13em;text-transform:uppercase;margin:0}.meter{height:8px;border-radius:9px;background:#2a2d32;overflow:hidden;width:34%;min-width:100px}.meter i{height:100%;display:block;background:linear-gradient(90deg,#bb182a,var(--red2));border-radius:9px;transition:width .3s}
    .items{display:grid;gap:9px}.item{display:grid;grid-template-columns:32px 1fr auto;align-items:start;gap:12px;padding:13px 14px;border:1px solid #2d3036;border-radius:9px;background:#101216}.item h3{margin:0 0 3px;font-size:15px}.item p{margin:0;color:var(--muted);font-size:13px}.icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:900}.complete .icon{background:#0c3528;color:var(--green)}.in-progress .icon{background:#41230a;color:var(--amber)}.open .icon{background:#32151a;color:#ff7c86}.status{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-top:5px}.complete .status{color:var(--green)}.in-progress .status{color:var(--amber)}
    .tracker{padding:0;overflow:hidden}.tracker summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:750;display:flex;justify-content:space-between}.tracker summary::-webkit-details-marker{display:none}.tracker summary:after{content:'+';color:var(--red2)}.tracker[open] summary:after{content:'−'}.tasks{padding:4px 18px 18px;max-height:52vh;overflow:auto}.section{margin:14px 0 6px;color:var(--red2);font-size:11px;text-transform:uppercase;letter-spacing:.15em}.task{padding:8px 4px;border-top:1px solid #292c31;color:#d6d8dc;font-size:13px}.task.done{color:#777e87;text-decoration:line-through}.task em{font-style:normal;color:var(--muted);padding-right:8px}.none{color:var(--muted);padding:12px}.foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;margin-top:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 9px #58d39b80}.error{color:var(--red2)}
    @media(max-width:700px){main{padding:16px 12px 28px}.summary{grid-template-columns:repeat(2,1fr)}.topmeta{font-size:10px}.item{grid-template-columns:30px 1fr}.status{grid-column:2;padding:0}.card{padding:13px}.cardhead{align-items:flex-start;gap:10px}}
  </style>
</head>
<body><main>
  <header class="top"><div class="badge">T<span>F</span></div><div><h1>TACTICA FC<small>GÖREV PANOSU</small></h1></div><div class="topmeta"><strong id="clock">Bağlanıyor…</strong><span id="source">Yerel görev kaynağı</span></div></header>
  <section class="summary" aria-label="Görev özeti"><div class="stat"><b id="total">—</b><span>Toplam hedef</span></div><div class="stat"><b id="done">—</b><span>Tamamlandı</span></div><div class="stat"><b id="active">—</b><span>Devam ediyor</span></div><div class="stat"><b id="open">—</b><span>Açık</span></div></section>
  <section class="card"><div class="cardhead"><h2 id="goal">Ana hedef</h2><div class="meter" aria-label="İlerleme"><i id="progress"></i></div></div><div class="items" id="items"><div class="none">Görevler yükleniyor…</div></div><div class="foot"><span><i class="dot"></i><span id="connection">Canlı</span> · her 60 saniyede yenilenir</span><span id="refresh">Son kontrol: —</span></div></section>
  <details class="tracker" open><summary><span>Repo TASKS.md · açık işler ve tamamlanan kayıtlar</span><span id="tracker-count" class="status"></span></summary><div class="tasks" id="tasks"><div class="none">Görevler yükleniyor…</div></div></details>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={complete:'Tamamlandı','in-progress':'Devam ediyor',open:'Açık'};
function render(d){const items=d.items||[];const done=items.filter(x=>x.status==='complete').length;const active=items.filter(x=>x.status==='in-progress').length;const open=items.length-done-active;const tasks=(d.tasks||[]).filter(t=>!t.heading);document.querySelector('#goal').textContent=d.goal;document.querySelector('#total').textContent=items.length;document.querySelector('#done').textContent=done;document.querySelector('#active').textContent=active;document.querySelector('#open').textContent=open;document.querySelector('#progress').style.width=(items.length?Math.round(done/items.length*100):0)+'%';document.querySelector('#items').innerHTML=items.map(x=>`<article class="item ${esc(x.status)}"><div class="icon">${x.status==='complete'?'✓':x.status==='in-progress'?'◷':'·'}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></div><div class="status">${esc(labels[x.status]||x.status)}</div></article>`).join('');document.querySelector('#clock').textContent='Güncelleme: '+new Date(d.updatedAt||d.checkedAt).toLocaleString('tr-TR');document.querySelector('#source').textContent='Kaynak: '+esc(d.source||'TASKS.md');document.querySelector('#refresh').textContent='Son kontrol: '+new Date().toLocaleTimeString('tr-TR');document.querySelector('#connection').textContent='Canlı';document.querySelector('#connection').className='';document.querySelector('#tracker-count').textContent=tasks.filter(t=>!t.done).length+' açık / '+tasks.length+' görev';document.querySelector('#tasks').innerHTML=(d.tasks||[]).map(t=>t.heading?`<div class="section">${esc(t.text)}</div>`:`<div class="task ${t.done?'done':''}"><em>${t.done?'✓':'○'}</em>${esc(t.text)}</div>`).join('')||'<div class="none">TASKS.md içinde checkbox bulunamadı.</div>'}
async function refresh(){try{const r=await fetch('/api/status?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){document.querySelector('#connection').textContent='Bağlantı kesildi';document.querySelector('#connection').className='error';document.querySelector('#refresh').textContent=e.message}}
refresh();setInterval(refresh,60000);
</script></body></html>
